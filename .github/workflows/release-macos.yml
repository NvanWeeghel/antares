name: Release [MAC]

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the DMG to (e.g. v0.7.35)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and attach the DMG to'
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # Keep the app version (About screen, DMG name) in line with the release tag,
      # even if package.json was not bumped before tagging
      - name: Set version from release tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # node-gyp needs distutils, which was removed in Python 3.12
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          npm install "dmg-license" --save-optional

      - name: Check signing secrets
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      # Signed with the Developer ID Application certificate and notarized, so Gatekeeper
      # opens the app and the in-app updater can install new versions
      - name: Build, sign and notarize
        run: npm run build -- -c.mac.notarize.teamId="$APPLE_TEAM_ID"
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The DMG is for new installs; the in-app updater downloads the zip listed in latest-mac.yml
      - name: Upload build to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" build/*.dmg build/*.zip build/*.blockmap build/latest-mac.yml --clobber
